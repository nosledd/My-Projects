[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-automation-platform"
version = "0.1.0"
description = "Local-first AI automation platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Project Maintainer" },
]
dependencies = [
  "flask>=3.0",
  "openpyxl>=3.1",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "reportlab>=4.0",
]

[project.scripts]
automation = "automation.interface.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
ocr = [
  "pdf2image>=1.17",
  "pytesseract>=0.3.13",
  "Pillow>=10.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.vercel]
entrypoint = "app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
automation = ["interface/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
